name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: Tag matches Version
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "const Version = \"$want\"" version.go || { echo "version.go does not say $want"; exit 1; }
      - run: go test -race -count=1 ./...
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
      - name: Index on the Go module proxy
        run: cd "$(mktemp -d)" && GOPROXY=https://proxy.golang.org GO111MODULE=on go list -m "github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
